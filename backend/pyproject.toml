[project]
name = "mazda6-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the unofficial Mazda AI Assistant"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1,<2",
    "fastapi>=0.115,<1",
    "httpx2>=2.13.1,<3",
    "psycopg[binary]>=3,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: opt-in tests requiring the migrated local PostgreSQL test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
